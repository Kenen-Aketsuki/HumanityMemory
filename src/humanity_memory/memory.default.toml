# ============================================================================
# HumanityMemory 出厂配置
# ----------------------------------------------------------------------------
# 这个文件随包发布，是**所有可调参数的唯一定义处**；代码里不写阈值字面量。
#
# 覆盖方式：三层深合并，优先级 项目 > 用户 > 出厂，逐键覆盖。
#   出厂  包内本文件                      —— 不要改，随升级被替换
#   用户  ~/.humanity-memory/memory.toml  —— 跨项目偏好
#   项目  <项目>/.ai_memory/memory.toml   —— 单项目调参，可入库分享
# 只写要改的那几行即可，其余键自动继承上一级；不需要复制整份文件。
#
# 凭据不在这里：embedding 的 api_key 走 .env / 环境变量 / mcp.json 的 env。
# 分工一句话：TOML 存行为，.env 存凭据。
#
# 数组表（[[...]]）语义上是整体替换，不逐元素合并 —— 要改等级表就重写整段。
# ============================================================================

[meta]
# 配置结构版本。加载器只在版本不认识时报错，不自动迁移。
version = 1


# ============================================================================
# 遗忘：等级表 + 删除判据
# ============================================================================
[forget]
# 落到 0 级（遗忘层）后，停留超过这么多天仍未复活 → 进入删除候选
level0_purge_days = 180
# 已归档后多久进入删除候选
# 与上一项语义不同（一个在遗忘层、一个在归档区），故分开配置；取值相同只是巧合
archived_purge_days = 180
# 两次遗忘计算的间隔上限（天）。超出的部分算「冻结期」，不计入记忆寿命。
# 工程长期静默（出差、停摆、几个月没开会话）时，真实流逝的时间不该按天折算成
# 记忆寿命 —— 否则回来跑一次 judge，所有条目的周期起点都停在几个月前，
# 一判断全是「已到期」，接下来的日子就只剩集体降级。
#
# 取值 2 不是随手定的：冻结后一次计算最多承认 2 天流逝，于是
#   周期 > 2 天的档位（L3 及以上）在静默后仍然不到期 —— 它们都还有价值；
#   周期 ≤ 2 天的 L2/L1 照常掉下去 —— 那两档本来就快进遗忘层，无所谓。
# 想保护得更宽就调小（但会拖慢正常衰减），想更中性就调大到接近实际计算间隔。
# 置 0 关闭冻结（回到「有多少算多少」的旧行为）。
max_gap_days = 2
# 0 级复活所需的深度命中次数
revive_hits = 2
# 复活后落到哪一级
revive_to_level = 1

# ----------------------------------------------------------------------------
# 遗忘等级表（0~10 共 11 档）
# 顺序任意，程序按 level 字段排序；加一档只需新增一段 [[forget.levels]]。
# 顶档不写 up_threshold（不能再升）；0 级不写周期（不参与周期裁定）。
# up_threshold / down_threshold 是周期末的「活跃度」判据，不是分数本身。
#
# 分两段看，这是本表的设计意图：
#   1~5 级 —— 短时记忆。两种周期都在 1 周以内，一天到一周就裁定一次，
#             新条目在这里快速试错：被检索到就往上爬，没人再问就往下掉。
#   6~10 级 —— 长期记忆。从月级起步逐级拉长到一年半，只有连续多个周期
#             都保持活跃的条目才配待在这一段。
# 因此「升到 6 级」是一条真正的分水岭：那之前是工作记忆，那之后是沉淀。
# ----------------------------------------------------------------------------

[[forget.levels]]
level = 10
period_experience_days = 540
period_episode_days = 365
down_threshold = 27.2
compress = "full"

[[forget.levels]]
level = 9
period_experience_days = 365
period_episode_days = 240
up_threshold = 34.0
down_threshold = 20.0
compress = "full"

[[forget.levels]]
level = 8
period_experience_days = 240
period_episode_days = 120
up_threshold = 25.0
down_threshold = 14.4
compress = "full"

[[forget.levels]]
level = 7
period_experience_days = 120
period_episode_days = 60
up_threshold = 18.0
down_threshold = 10.4
compress = "full"

[[forget.levels]]
level = 6
period_experience_days = 30
period_episode_days = 21
up_threshold = 13.0
down_threshold = 7.6
compress = "full"

[[forget.levels]]
level = 5
period_experience_days = 7
period_episode_days = 7
up_threshold = 9.5
down_threshold = 5.6
compress = "full"

[[forget.levels]]
level = 4
period_experience_days = 5
period_episode_days = 5
up_threshold = 7.0
down_threshold = 4.0
compress = "full"

[[forget.levels]]
level = 3
period_experience_days = 3
period_episode_days = 3
up_threshold = 5.0
down_threshold = 2.8
compress = "full"

[[forget.levels]]
level = 2
period_experience_days = 2
period_episode_days = 2
up_threshold = 3.5
down_threshold = 1.6
compress = "full"

[[forget.levels]]
level = 1
period_experience_days = 1
period_episode_days = 1
up_threshold = 2.0
down_threshold = 0.5
compress = "sentence"

[[forget.levels]]
level = 0
compress = "title"


# ============================================================================
# 初始等级：importance 决定录入时落到哪档
# ============================================================================
[initial]
# 每条记忆录入时模型给一个 importance（0~1），按 min_importance 降序匹配第一个满足的档。
# 上限固定为「最高等级 - 1」：顶档只能靠活跃度挣，不能录入即设。
# 下限受校验约束（不得低于 2），避免新记忆一进来就在遗忘边缘。
#
# 三档全部落在短时记忆段（2~4 级，周期 2~5 天）：
# 新条目先当工作记忆对待，够不够格沉淀由「之后有没有被检索到」说话，
# 而不是由录入那一刻的 importance 一次性定终身。
# 上限停在 4 而不是 5：L5（7 天）留给活跃度去挣 —— 录入即顶格会让
# 「最高等级是挣来的」这条原则失效，而 4 级的 5 天周期同样在「一周内」。

[[initial.bands]]
min_importance = 0.55
level = 4

[[initial.bands]]
min_importance = 0.30
level = 3

[[initial.bands]]
min_importance = 0.00
level = 2


# ============================================================================
# 可信度：读之前要不要先验
# ============================================================================
[confidence]
# 低于此值 → 检索命中时提示「先验证再用」
verify_on_read = 0.5
# 高于此值 → 视为事实，不再主动复核
treat_as_fact = 0.85
# 加分曲线：min(1 - c, gain_k * interval ^ gain_alpha)
gain_k = 0.05
gain_alpha = 1.4
# 证伪曲线：min(c, loss_k * interval ^ gain_alpha)
loss_k = 0.15

# 证据级别权重。L3（听说）恒为 0，不开放配置 —— 那是语义约束，不是参数。
[confidence.level_weight]
L1 = 1.0
L2 = 0.5


# ============================================================================
# 活跃度：周期内按检索相关性加权累加，周期末裁定后清零
# ============================================================================
[activity]
# 相关性低于此值不计分（噪声不该给记忆续命）
sim_floor = 0.35
# 单次贡献 = (sim - sim_floor) ^ curve_power
curve_power = 2.0


# ============================================================================
# 检索：打分权重与深度回忆触发线
# ============================================================================
[retrieval]
w_retrieval = 0.72
w_importance = 0.12
# 等级权重。第三项是遗忘等级的倍率：`(level / 最高等级) ^ level_factor_power`，
# 0 级恒为 0（它本来就不进常规检索）。想逐级手调就在下面填映射表覆盖公式。
# power 与档数是一对：5 档时 1.5 让中间档落在 0.7 左右；扩到 10 档后分母翻倍，
# 同样的 1.5 会把 4 级压到 0.25。0.65 让 (6/10)^0.65 ≈ 0.717，与旧的 (4/5)^1.5 等值，
# 即「长期记忆的起点」在排序里仍占原来的分量。改档数时记得回来重算这个值。
w_level = 0.16
level_factor_power = 0.65
# 常规检索最高分低于此值才触发深度回忆（扫 0 级遗忘层）
deep_recall_floor = 0.35


# ============================================================================
# 查重：新经验是否已在库里
# ============================================================================
[dedup]
# 经验录入查重：写入前在经验层做向量 top-k，最高相似度达到此值即判定为重复。
# 置 0 关闭查重（没有 embedding 服务时本来也自动降级）。
dup_floor = 0.90
# 判定重复时给既有条目的活跃度补偿：一样东西被写第二遍，说明它重要
dup_bonus = 0.30
# 取多少条候选来比。3 条足够 —— 真正的重复不会排在第四位
topk = 3


# ============================================================================
# 压缩：按遗忘等级决定目标压缩级别
# ============================================================================
[compress]
# 下标 = forget_level，值 = 目标 compression_level。
# 长度必须等于等级档数（现在 11 档 → 11 个元素），短了会越界、长了会静默错位。
# 0 = 不压 / 1 = 中度 / 2 = 一句话 / 3 = 标题级，随等级升高而变轻。
#
# 只有 1 级往下才压。为什么不是 2 级：2 级是录入落点之一，而 1~5 级同时是
# 「考察期」——记忆在这里证明自己够不够格升到长期段。考察期把正文压成一句话，
# 等于把判断依据销毁了（压缩是覆盖写，升上去也回不来）。所以压缩区必须整个
# 落在考察期之下：L2 及以上一律不动，L1 压到一句话，L0 压到标题。
# 代价是压缩几乎只剩「快进遗忘层时收一下」这一下 —— 这是有意的：
# 工作记忆的价值就在于「还没来得及被用」，不能先把它压没。
required_compression = [3, 2, 0, 0, 0, 0, 0, 0, 0, 0, 0]


# ============================================================================
# 旁路报告：裁定报告与检索统计
# 这两样只写文件、不进库 —— 它们是调参和复盘的证据，不是记忆本体。
# 写失败不会影响裁定与检索本身（旁路丢了只少一份记录）。
# ============================================================================
[report]
# judge 报告开关：关掉就完全不写报告
judge_enabled = true
# judge 报告目录（相对 .ai_memory/）：每次裁定落一份 .md + 同名 .json
judge_dir = "reports/judge"
# 只保留最近多少份（0 = 不清理）
judge_keep = 30
# 检索统计开关：关掉就完全不写记录
retrieval_enabled = true
# 检索记录目录（相对 .ai_memory/）：一天一个 .jsonl
retrieval_dir = "retrieval"
# 检索记录保留天数（0 = 不清理）
retrieval_keep_days = 90


# ============================================================================
# Embedding
# ============================================================================
[embedding]
# 留空表示未配置 → 退化为关键词检索（doctor 会显式提示）
base_url = ""
model = "BAAI/bge-m3"
dim = 1024
batch = 32
timeout = 30


# ============================================================================
# 存量机制参数（等级机制上线前后都在用，先一并收进这里）
# ============================================================================
[lifecycle]
# 归档后静默多少天算「删除候选」（只报告，绝不自动删）
purge_after_days = 180.0
# 被再次检索时的强度加成
reinforce_boost = 0.20

# 归档判据：超过 ttl 天没被碰过、且访问次数不超过 archive.max_access → 归档。
# 归档可逆（正文一字不动），只是默认检索不到。
[lifecycle.archive]
max_access = 1
[lifecycle.archive.ttl]
# 超过这么多天没被碰过、且访问次数不超过 max_access → 归档（可逆）
experience = 1095.0
episode = 365.0


# ============================================================================
# 录入默认值
# ============================================================================
[defaults.importance]
# 调用方没显式给 importance 时按类型取默认值。
# 经验比经历略高（结论比流水账更值得留），log 最低。
experience = 0.80
episode = 0.40
log = 0.30


# ============================================================================
# 检索候选池与容量告警
# ============================================================================
[search]
# 取 limit * candidate_multiplier 条候选，至少 40 条，上限 max_candidates
candidate_multiplier = 8
max_candidates = 240
# 常规检索的相关性下限（0~1，只看 retrieval = 向量 + 词法融合）。
# 低于它的候选直接不返回：重要度 / 等级 / 热度都不参与这个判断。
#
# 出厂刻意给"偏严格"的值：项目还在调参阶段，一个没标定过的松阈值会直接
# 把噪音放出去，而严格了最多是召回偏少、看得见、好调。换 embedding 模型后
# 按下面的方法重新标定：
#   1. 拿一个和库内容完全无关的查询跑一遍
#   2. 看它 top1 的 vector_similarity，往上留 0.01~0.03 余量
#   3. 用两三个真实查询确认目标条目仍能命中
min_retrieval = 0.78
# 保底检索：严格阈值一条都没捞到时，才用更宽的方式再找一遍。
#   off     = 关闭，只返回严格命中
#   rrf     = 把查询按词拆开分别检索，再用排名融合（对「整句语义漂移」最有效）
#   maxpool = 每条文档取各路相似度的最大值（成本低，但容易放进单路噪音）
fallback_mode = "maxpool"
# 严格层结果少于这个数就触发兜底；1 = 只有完全为空才触发
fallback_min_hits = 1
# 兜底层门槛（仅 maxpool 使用，相似度尺度）。
# 与 min_retrieval 持平：兜底靠的是「拆词后单词语义更清晰」，
# 不是靠降低门槛去硬凑结果。
fallback_floor = 0.78

# ============================================================================
# 复盘闸门：memory_search 什么时候放行
# ============================================================================
# 为什么需要：search 刻意不改访问强度，recall 会强化命中项。
# 日常拿 search 顶替 recall，这些真实使用就一条都不计入活跃度，
# 遗忘曲线随之失真（记忆不老化，或者老化了但不是因为真的没被用）。
# 所以日常一律走 recall，search 只留给盘点。
[review]
# 允许 memory_search 的时间窗（本地时间，可跨午夜）。空串 = 只认手签通行证。
# 00:00-08:00：复盘在次日凌晨做 —— 盘的是前一天，前一晚的日志到这时才齐。
# 自动化复盘天然落在这个窗口内，不需要任何人工动作。
window = "00:00-08:00"
# `review begin` 默认签发多少分钟的通行证。到期自动失效。
flag_minutes = 30
# 签发通行证是否要求 stdin 是真终端。**弱信号**：带伪终端（ConPTY）的环境里
# isatty() 会偶发误判成 True，所以它只挡「顺手调一次」，不当作身份验证。
# 真正的兜底是下面的配额 + 审计留痕。
require_tty = true
# 是否开放手签通道。设 false = 只剩时间窗，白天一次都搜不了。
# 这是唯一不依赖「谁在调」的绝对硬约束 —— 想彻底封死就把它关掉。
allow_flag = true
# 每天最多签发几张通行证。就算 TTY 判据被绕过，滥用也有天花板。
daily_flag_limit = 2

