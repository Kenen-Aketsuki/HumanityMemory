[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humanity-memory"
version = "0.1.0"
description = "SQLite + sqlite-vec based long-term memory store, exposed as an MCP server and a Skill set"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlite-vec>=0.1.9",
    "mcp>=2.0",
    "httpx>=0.27",
]

[project.scripts]
humanity-memory = "humanity_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
