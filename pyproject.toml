[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "humanity-memory"
version = "0.5.2"
description = "SQLite + sqlite-vec based long-term memory store (experience / episode), exposed as an MCP server and a Skill set"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlite-vec>=0.1.9",
    "mcp>=2.0",
    "httpx>=0.27",
    # 3.10 没有 tomllib；3.11+ 一行都不装（纯 Python，约 8KB）
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
humanity-memory = "humanity_memory.cli:main"

# 打包工具不进运行时依赖：普通用户 pip install 不需要 PyInstaller
[project.optional-dependencies]
build = ["pyinstaller>=6"]

[tool.setuptools.packages.find]
where = ["src"]

# 随包分发的不只是 .py：schema 和出厂配置都得进 wheel，
# 否则 pip install 到 site-packages 后这两个文件会凭空消失。
[tool.setuptools.package-data]
humanity_memory = ["schema.sql", "memory.default.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
